name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  build-artifacts:
    name: Build artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0

      - name: Publish project
        working-directory: src/KeyConnector
        run: |
          dotnet publish -c "Release" -o obj/build-output/publish
          cd obj/build-output/publish
          zip -r KeyConnector.zip .
          mv KeyConnector.zip ../../../

      - name: Upload project artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: KeyConnector.zip
          path: src/KeyConnector/KeyConnector.zip
          if-no-files-found: error
          retention-days: 7

  build-docker:
    name: Build Docker images
    runs-on: ubuntu-24.04
    needs: build-artifacts
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      _GHCR_REGISTRY: ghcr.io/bitwarden
      _PROJECT_NAME: key-connector
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generate Docker image tag
        id: tag
        uses: bitwarden/gh-actions/sanitize-image-tag@main
        with:
          ref: ${{ github.head_ref || github.ref }}
          fork_repo: ${{ github.event.pull_request.head.repo.fork == true && github.event.pull_request.head.repo.full_name || '' }}

      - name: Report Docker image tag
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "### :mega: Docker Image Tag: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate image tag(s)
        id: image-tags
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "tags=${_GHCR_REGISTRY}/${_PROJECT_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Get build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: KeyConnector.zip

      - name: Set up build artifact
        run: |
          mkdir -p src/KeyConnector/obj/build-output/publish
          unzip KeyConnector.zip -d src/KeyConnector/obj/build-output/publish

      - name: Build custom image metadata
        id: custom-meta
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "items<<METADATA_EOF"
            echo "org.opencontainers.image.title=Bitwarden Key Connector"
            echo "org.opencontainers.image.vendor=Bitwarden Inc."
            echo "org.opencontainers.image.url=https://bitwarden.com"
            echo "org.opencontainers.image.version=${IMAGE_TAG}"
            echo "org.opencontainers.image.revision=${REVISION}"
            echo "com.bitwarden.project=${_PROJECT_NAME}"
            echo "METADATA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          labels: ${{ steps.custom-meta.outputs.items }}
          annotations: ${{ steps.custom-meta.outputs.items }}

      - name: Build Docker image
        id: build-docker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/KeyConnector
          file: src/KeyConnector/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max

      - name: Install Cosign
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Cosign
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          DIGEST: ${{ steps.build-docker.outputs.digest }}
          TAGS: ${{ steps.image-tags.outputs.tags }}
        run: |
          IFS=',' read -r -a tags_array <<< "${TAGS}"
          images=()
          for tag in "${tags_array[@]}"; do
            images+=("${tag}@${DIGEST}")
          done
          cosign sign --yes "${images[@]}"

      - name: Log out of Docker
        run: docker logout ghcr.io
